# This is a basic workflow to help you get started with Actions
name: build docker image
# Controls when the action will run.
on:
  push:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  # 可以手动触发
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "warning"
      tags:
        description: "Test scenario tags"

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Download latest mihomo binary
        run: |
          set -eux
          mihomo_url="$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep '"browser_download_url":' \
            | grep -E 'mihomo-linux-amd64-v[0-9]+\.[0-9]+\.[0-9]+\.gz' \
            | head -n 1 \
            | cut -d '"' -f 4)"
          curl -fsSL "$mihomo_url" -o /tmp/mihomo.gz
          gzip -dc /tmp/mihomo.gz > clash
          chmod +x clash
          ./clash -v

      - name: Get current date
        id: date
        run: echo "::set-output name=today::$(date +'%Y-%m-%d_%H-%M')"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1

      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          # 所需要的体系结构，可以在 Available platforms 步骤中获取所有的可用架构
          platforms: linux/amd64,linux/arm64/v8
          # 镜像推送时间
          push: ${{ github.event_name != 'pull_request' }}
          # 给清单打上多个标签
          tags: |
            allenjax/clash:${{ steps.date.outputs.today }}
            allenjax/clash:latest
